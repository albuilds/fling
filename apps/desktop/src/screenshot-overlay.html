<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <title>Fling Screenshot</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/screenshot-overlay.css" />
  </head>
  <body>
    <div class="overlay" id="overlay"></div>
    <div class="hint">Drag to select a screenshot area</div>
    <div class="selection" id="selection"></div>
    <div class="toolbar" id="toolbar">
      <div class="capture-options" aria-label="Screenshot options">
        <label class="capture-option">
          <input id="copyOption" type="checkbox" />
          Copy
        </label>
        <label class="capture-option">
          <input id="saveOption" type="checkbox" checked />
          Save
        </label>
        <label class="capture-option" id="uploadOptionLabel">
          <input id="uploadOption" type="checkbox" />
          Upload
        </label>
      </div>
      <button class="screenshot-button" type="button" id="screenshotButton">
        screenshot
      </button>
      <button class="cancel-button" type="button" id="cancelButton">
        Cancel
      </button>
      <span class="status" id="status">Saving...</span>
    </div>

    <script src="scripts/screenshot-overlay.js"></script>
  </body>
</html>
