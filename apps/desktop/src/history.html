<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <title>Fling History</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/chrome.css" />
    <link rel="stylesheet" href="styles/history.css" />
  </head>
  <body>
    <header>
      <svg class="logo-mark" width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M5 19V5h14" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="square" />
        <path d="M12.5 27.5 27.5 12.5" stroke="currentColor" stroke-width="3.4" stroke-linecap="square" />
      </svg>
      <h1>fling</h1>
      <span class="version">v0.1.0</span>
      <div class="window-controls" aria-label="Window controls">
        <button
          class="window-control"
          type="button"
          title="Minimize"
          aria-label="Minimize"
          data-window-action="minimize"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          >
            <path d="M6 18h12" />
          </svg>
        </button>
        <button
          class="window-control"
          type="button"
          title="Maximize"
          aria-label="Maximize"
          data-window-action="toggleMaximize"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <rect x="6" y="6" width="12" height="12" rx="1.5" />
          </svg>
        </button>
        <button
          class="window-control close"
          type="button"
          title="Close"
          aria-label="Close"
          data-window-action="close"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          >
            <path d="M7 7l10 10M17 7 7 17" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div class="section">
        <div class="section-header">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 12a9 9 0 1 0 3-6.7" />
            <path d="M3 3v6h6" />
            <path d="M12 7v5l4 2" />
          </svg>
          Recent Uploads
          <span class="section-count" id="historyCount">0 uploads</span>
          <button class="btn-icon refresh-button" id="refreshButton" type="button" title="Refresh history" aria-label="Refresh history">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
            </svg>
          </button>
        </div>

        <div id="uploads"></div>
      </div>
    </main>

    <footer>
      <span class="hint">Showing recent captures in your Fling account</span>
    </footer>

    <script src="scripts/history.js"></script>
  </body>
</html>
