<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <title>Fling History</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        color-scheme: dark;
        --bg: #0d0d12;
        --surface: #15151e;
        --border: #222230;
        --accent: #7c5af8;
        --accent-glow: rgba(124, 90, 248, 0.25);
        --text: #e8e8f0;
        --muted: #6b6b80;
        --danger: #f85a5a;
        --success: #5af8a0;
        --radius: 12px;
        --font: -apple-system, "Segoe UI", sans-serif;
      }

      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          color-scheme: light;
          --bg: #f7f7fb;
          --surface: #ffffff;
          --border: #ddddeb;
          --accent: #6f4df2;
          --accent-glow: rgba(111, 77, 242, 0.18);
          --text: #292937;
          --muted: #626176;
          --danger: #dc433d;
          --success: #12824b;
        }
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f7f7fb;
        --surface: #ffffff;
        --border: #ddddeb;
        --accent: #6f4df2;
        --accent-glow: rgba(111, 77, 242, 0.18);
        --text: #292937;
        --muted: #626176;
        --danger: #dc433d;
        --success: #12824b;
      }

      html {
        background: var(--bg);
        scrollbar-color: var(--border) var(--bg);
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.5;
        min-height: 100vh;
        scrollbar-color: var(--border) var(--bg);
        display: flex;
        flex-direction: column;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 58px;
        padding: 14px 14px 14px 28px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(21, 21, 30, 0.96), var(--bg));
        -webkit-app-region: drag;
      }
      header svg {
        color: var(--accent);
        flex-shrink: 0;
      }
      header h1 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.3px;
        background: linear-gradient(135deg, #fff 40%, var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      header .version {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 2px 10px;
      }
      .window-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: 6px;
        -webkit-app-region: no-drag;
      }
      .window-control {
        width: 32px;
        height: 28px;
        display: grid;
        place-items: center;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }
      .window-control:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: var(--border);
        color: var(--text);
      }
      .window-control svg {
        color: currentColor;
      }
      .window-control.close:hover {
        background: rgba(248, 90, 90, 0.12);
        border-color: rgba(248, 90, 90, 0.35);
        color: var(--danger);
      }
      button {
        -webkit-app-region: no-drag;
      }

      main {
        flex: 1;
        overflow-y: auto;
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scrollbar-color: var(--border) var(--bg);
        scrollbar-width: thin;
      }

      .section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .section-header svg {
        color: var(--accent);
      }
      .section-count {
        margin-left: auto;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
      }

      .upload-row {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 13px 18px;
        transition: background 0.15s;
      }
      .upload-row + .upload-row {
        border-top: 1px solid var(--border);
      }
      .upload-row:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      .thumb {
        width: 44px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 8px;
        background:
          linear-gradient(
            135deg,
            rgba(124, 90, 248, 0.18),
            rgba(90, 248, 160, 0.08)
          ),
          var(--bg);
        color: var(--accent);
        overflow: hidden;
      }
      .thumb.video {
        color: var(--success);
      }
      .thumb.gif {
        color: #f8c45a;
      }

      .upload-meta {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .upload-meta strong {
        overflow: hidden;
        color: var(--text);
        font-size: 13.5px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .upload-meta span {
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .upload-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .status {
        color: var(--success);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .btn-icon {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--muted);
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s,
          transform 0.1s;
      }
      .btn-icon:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      .btn-icon:active {
        transform: scale(0.97);
      }

      .history-state {
        display: grid;
        place-items: center;
        gap: 6px;
        min-height: 210px;
        padding: 32px;
        color: var(--muted);
        text-align: center;
      }
      .history-state strong {
        color: var(--text);
        font-size: 14px;
        font-weight: 650;
      }
      .history-state span {
        max-width: 360px;
        font-size: 12px;
      }
      .status.expired {
        color: var(--muted);
      }
      .btn-icon:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }
      .btn-icon:disabled:hover {
        border-color: var(--border);
        color: var(--muted);
      }
      .refresh-button {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
      }
      .refresh-button.loading svg {
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      footer {
        padding: 14px 28px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
      }
      .hint {
        margin-right: auto;
        color: var(--muted);
        font-size: 12px;
      }

      *::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      *::-webkit-scrollbar-track {
        background: var(--bg);
      }
      *::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 10px;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: #303044;
      }

      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) header {
          background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), var(--bg));
        }

        :root:not([data-theme="dark"]) header h1 {
          background: linear-gradient(135deg, #101018 40%, var(--accent));
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        :root:not([data-theme="dark"]) .window-control {
          color: var(--text);
        }

        :root:not([data-theme="dark"]) .window-control:hover,
        :root:not([data-theme="dark"]) .upload-row:hover {
          background: rgba(18, 18, 28, 0.04);
        }
      }

      :root[data-theme="light"] header {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), var(--bg));
      }

      :root[data-theme="light"] header h1 {
        background: linear-gradient(135deg, #101018 40%, var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      :root[data-theme="light"] .window-control {
        color: var(--text);
      }

      :root[data-theme="light"] .window-control:hover,
      :root[data-theme="light"] .upload-row:hover {
        background: rgba(18, 18, 28, 0.04);
      }

      @media (max-width: 620px) {
        .upload-row {
          grid-template-columns: 40px minmax(0, 1fr);
        }
        .upload-actions {
          grid-column: 2;
          justify-content: flex-start;
        }
        .status {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
      </svg>
      <h1>Fling</h1>
      <span class="version">v0.1.0</span>
      <div class="window-controls" aria-label="Window controls">
        <button
          class="window-control"
          type="button"
          title="Minimize"
          aria-label="Minimize"
          data-window-action="minimize"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          >
            <path d="M6 18h12" />
          </svg>
        </button>
        <button
          class="window-control"
          type="button"
          title="Maximize"
          aria-label="Maximize"
          data-window-action="toggleMaximize"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <rect x="6" y="6" width="12" height="12" rx="1.5" />
          </svg>
        </button>
        <button
          class="window-control close"
          type="button"
          title="Close"
          aria-label="Close"
          data-window-action="close"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          >
            <path d="M7 7l10 10M17 7 7 17" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div class="section">
        <div class="section-header">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 12a9 9 0 1 0 3-6.7" />
            <path d="M3 3v6h6" />
            <path d="M12 7v5l4 2" />
          </svg>
          Recent Uploads
          <span class="section-count" id="historyCount">0 uploads</span>
          <button class="btn-icon refresh-button" id="refreshButton" type="button" title="Refresh history" aria-label="Refresh history">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
            </svg>
          </button>
        </div>

        <div id="uploads"></div>
      </div>
    </main>

    <footer>
      <span class="hint">Showing recent captures in your Fling account</span>
    </footer>

    <script>
      const uploadsContainer = document.getElementById("uploads");
      const historyCount = document.getElementById("historyCount");
      const refreshButton = document.getElementById("refreshButton");
      const hint = document.querySelector(".hint");
      let isLoading = false;

      const icons = {
        image:
          `<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="10" r="1.5"/><path d="m21 15-5-5L5 19"/>`,
        video:
          `<rect x="3" y="5" width="15" height="14" rx="2"/><path d="m18 10 4-2v8l-4-2"/>`,
      };

      document.querySelectorAll("[data-window-action]").forEach((button) => {
        button.addEventListener("click", () => {
          window.flingWindow?.[button.dataset.windowAction]?.();
        });
      });

      function applyTheme(theme) {
        document.documentElement.dataset.theme =
          theme === "light" || theme === "dark" ? theme : "system";
      }

      function formatBytes(bytes) {
        const value = Number(bytes);
        if (!Number.isFinite(value) || value < 0) return "Unknown size";
        if (value === 0) return "0 B";
        const units = ["B", "KB", "MB", "GB"];
        const index = Math.min(
          Math.floor(Math.log(value) / Math.log(1024)),
          units.length - 1,
        );
        const amount = value / 1024 ** index;
        return `${amount >= 10 || index === 0 ? amount.toFixed(0) : amount.toFixed(1)} ${units[index]}`;
      }

      function formatTime(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "Unknown date";
        return new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(date);
      }

      function renderState(title, detail) {
        const state = document.createElement("div");
        state.className = "history-state";
        const heading = document.createElement("strong");
        heading.textContent = title;
        const copy = document.createElement("span");
        copy.textContent = detail;
        state.append(heading, copy);
        uploadsContainer.replaceChildren(state);
      }

      function createActionButton(label, iconMarkup, action, disabled = false) {
        const button = document.createElement("button");
        button.className = "btn-icon";
        button.type = "button";
        button.title = label;
        button.setAttribute("aria-label", label);
        button.disabled = disabled;
        button.innerHTML = iconMarkup;
        button.addEventListener("click", action);
        return button;
      }

      function renderUploads(captures) {
        const uploads = Array.isArray(captures) ? captures : [];
        historyCount.textContent = `${uploads.length} ${uploads.length === 1 ? "upload" : "uploads"}`;

        if (uploads.length === 0) {
          renderState(
            "No uploads yet",
            "Upload a screenshot or recording and it will appear here.",
          );
          hint.textContent = "No captures in your Fling account yet";
          return;
        }

        const fragment = document.createDocumentFragment();
        for (const upload of uploads) {
          const type = upload.type === "video" ? "video" : "image";
          const expired = Boolean(
            upload.expiresAt && new Date(upload.expiresAt).getTime() <= Date.now(),
          );

          const row = document.createElement("div");
          row.className = "upload-row";

          const thumb = document.createElement("div");
          thumb.className = `thumb ${type}`;
          thumb.setAttribute("aria-hidden", "true");
          thumb.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[type]}</svg>`;

          const meta = document.createElement("div");
          meta.className = "upload-meta";
          const title = document.createElement("strong");
          title.textContent = upload.title || "Untitled capture";
          const detail = document.createElement("span");
          detail.textContent = `${formatTime(upload.createdAt)} · ${formatBytes(upload.byteSize)}`;
          meta.append(title, detail);

          const actions = document.createElement("div");
          actions.className = "upload-actions";
          const status = document.createElement("span");
          status.className = `status${expired ? " expired" : ""}`;
          status.textContent = expired ? "Expired" : "Uploaded";

          const copyButton = createActionButton(
            "Copy link",
            `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><rect x="2" y="2" width="13" height="13" rx="2"/></svg>`,
            async () => {
              try {
                await window.flingHistory.copyLink(upload.shareUrl);
                copyButton.title = "Copied";
                hint.textContent = "Share link copied to clipboard";
                setTimeout(() => { copyButton.title = "Copy link"; }, 1400);
              } catch {
                hint.textContent = "Could not copy the share link";
              }
            },
            expired,
          );

          const openButton = createActionButton(
            "Open link",
            `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>`,
            async () => {
              try {
                await window.flingHistory.openLink(upload.shareUrl);
              } catch {
                hint.textContent = "Could not open the share link";
              }
            },
            expired,
          );

          actions.append(status, copyButton, openButton);
          row.append(thumb, meta, actions);
          fragment.append(row);
        }

        uploadsContainer.replaceChildren(fragment);
        hint.textContent = "Showing recent captures in your Fling account";
      }

      async function loadHistory() {
        if (isLoading) return;
        isLoading = true;
        refreshButton.disabled = true;
        refreshButton.classList.add("loading");
        renderState("Loading uploads", "Fetching your latest captures...");

        try {
          const result = await window.flingHistory?.list?.();
          if (!result?.signedIn) {
            historyCount.textContent = "0 uploads";
            renderState(
              "Sign in to view history",
              "Connect Fling from the main window or tray menu, then refresh.",
            );
            hint.textContent = "Desktop is not connected to a Fling account";
            return;
          }
          renderUploads(result.captures);
        } catch (error) {
          console.error("Could not load history", error);
          historyCount.textContent = "Unavailable";
          renderState(
            "Could not load uploads",
            "Check that the Fling server is running, then try again.",
          );
          hint.textContent = "History request failed";
        } finally {
          isLoading = false;
          refreshButton.disabled = false;
          refreshButton.classList.remove("loading");
        }
      }

      refreshButton.addEventListener("click", () => void loadHistory());
      window.flingHistory?.onChanged?.(() => void loadHistory());

      window.addEventListener("DOMContentLoaded", async () => {
        const settings = await window.flingSettings?.get?.();
        applyTheme(settings?.appearance?.theme ?? "system");
        await loadHistory();
      });
    </script>
  </body>
</html>
