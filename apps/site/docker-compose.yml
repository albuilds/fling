services:
  site:
    image: fling-site:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fling-site
    env_file:
      - .env
    environment:
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  cleanup:
    profiles: ["maintenance"]
    image: fling-site:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      CLEANUP_URL: http://site:3000/api/internal/cleanup-expired
    command:
      - sh
      - -c
      - >-
        test -n "$${CLEANUP_SECRET}" &&
        wget -qO- --post-data='' --header="x-cleanup-secret: $${CLEANUP_SECRET}" "$${CLEANUP_URL}"
    depends_on:
      site:
        condition: service_started
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: fling-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
